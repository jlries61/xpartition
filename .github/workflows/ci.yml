name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: pip install .[test]
      - name: Run tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the built distributions
        run: |
          pip install twine
          twine check dist/*
      - name: Smoke-test the built wheel (import + CLI, away from the checkout)
        run: |
          pip install dist/*.whl
          cd /tmp
          printf 'X\n1\n2\n3\n4\n' | xpartition --cv=2
          python -c "import xpartition, pandas as pd; \
            out = xpartition.xpartition(pd.DataFrame({'X': range(4)})); \
            assert 'SAMPLE' in out.columns"

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pyproject.toml and xpartition.spec must agree on the version
        run: |
          py=$(grep -Po '^version\s*=\s*"\K[^"]+' pyproject.toml)
          rpm=$(grep -Po '^Version:\s*\K\S+' xpartition.spec)
          echo "pyproject.toml: $py"
          echo "xpartition.spec: $rpm"
          test "$py" = "$rpm"
