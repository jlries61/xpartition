name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Tag must match the packaged version
        run: |
          py=$(grep -Po '^version\s*=\s*"\K[^"]+' pyproject.toml)
          test "v$py" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match pyproject version $py"; exit 1; }
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --title "xpartition $GITHUB_REF_NAME" --generate-notes
