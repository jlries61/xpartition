[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xpartition"
version = "1.0.0"
description = "Exact data partitioner: split a table into learning, test, and holdout samples or CV folds, balanced on one or more fields"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "John L. Ries", email = "john@theyarnbard.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pandas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/jlries61/xpartition"

[project.scripts]
xpartition = "xpartition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
